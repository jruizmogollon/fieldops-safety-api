name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - run: dotnet restore FieldOps.Safety.sln
      - run: dotnet build FieldOps.Safety.sln --configuration Release --no-restore
      - run: dotnet test FieldOps.Safety.sln --configuration Release --no-build
